<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لا يوجد اتصال بالإنترنت | ويكس تكنولوجي</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px; background: #EAF3FF; color: #061A55;
         font-family: Tajawal, "Segoe UI", Tahoma, Arial, sans-serif; text-align: center; }
  main { max-width: 420px; background: #fff; border: 1px solid #D5E2F7; border-radius: 16px; padding: 32px 24px; }
  .mark { width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 50%; background: #EAF3FF;
          display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0 0 24px; line-height: 1.8; color: #4B5B85; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px;
         border-radius: 10px; background: #0B3FBF; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0B3FBF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
  </div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذّر تحميل المتجر. تحقّق من اتصالك ثم أعد المحاولة.</p>
  <a class="btn" href="/">إعادة المحاولة</a>
</main>
</body>
</html>
