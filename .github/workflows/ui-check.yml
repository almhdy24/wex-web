name: UI & Visual Regression Check

on:
  push:
    branches: [ stabilize, main ]
  pull_request:
    branches: [ stabilize, main ]
  workflow_dispatch:

concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-layout-check:
    name: Multi-Viewport Visual & Layout Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wex-web
        uses: actions/checkout@v4
        with:
          path: wex-web

      - name: Checkout wex-api
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/wex-api
          ref: feat/premium-ui-v2  # TEMP: API changes live on this branch until merged; remove on merge
          path: wex-api
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, curl, json, intl
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: wex-web/package-lock.json

      - name: Setup Backend API (if available)
        run: |
          if [ -d "wex-api" ]; then
            cd wex-api
            composer install --no-interaction --prefer-dist
            mkdir -p writable/database writable/uploads/proofs writable/logs
            touch writable/database/wex.sqlite
            # Explicit dev config (the CI4 'env' template means production: HTTPS forced and
            # only listed CORS origins, so every call from the preview origin failed with
            # net::ERR_FAILED).
            printf '%s\n' \
              'CI_ENVIRONMENT = development' \
              'database.default.DBDriver = SQLite3' \
              'database.default.database = wex.sqlite' \
              "JWT_SECRET = 'ci-ui-check-secret-key-at-least-32-characters'" \
              "CORS_ALLOWED_ORIGINS = 'http://127.0.0.1:4173,http://localhost:4173'" \
              "PUSH_PROVIDER = 'fake'" \
              'TESTING_LOGIN_ENABLED = true' > .env
            php spark migrate --all || true
            php spark db:seed DatabaseSeeder || true
            php spark db:seed DevSeeder || true
            php scripts/generate-product-images.php || echo "product image generation failed"
            # Several workers: a single-worker php -S is held by one idle Chromium
            # preconnect socket and every other API call queues behind it (networkidle never).
            PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8080 -t public > /tmp/api.log 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/v1/ping >/dev/null && break; sleep 1; done
            sleep 2
            curl -s http://127.0.0.1:8080/api/v1/ping || echo "Backend started"
          fi

      - name: Install Frontend Dependencies
        working-directory: wex-web
        run: |
          npm ci
          npm install -D playwright

      - name: Install Playwright Chromium
        working-directory: wex-web
        run: |
          npx playwright install --with-deps chromium

      - name: Run Static and Behavioral Checks
        working-directory: wex-web
        run: |
          node scripts/check-contrast.mjs
          node scripts/check-claims.mjs
          node scripts/check-i18n.mjs
          node scripts/check-layout.mjs
          node scripts/check-duplicate-messages.mjs
          node scripts/check-api-surface.mjs
          node scripts/check-css-modules.mjs
          node scripts/check-admin-english.mjs
          node scripts/contract-check.js
          node scripts/check-copy.mjs
          node node_modules/eslint/bin/eslint.js src --quiet
          npm run test

      - name: Build Production Frontend
        working-directory: wex-web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080/api/v1
        run: |
          npm run build

      - name: Start Preview Server
        working-directory: wex-web
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4173 --timeout 30000

      - name: Execute Multi-Viewport Layout & Visual Checks
        working-directory: wex-web
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node scripts/ci-ui-check.mjs

      - name: API server log (on failure)
        if: failure()
        run: |
          echo "== requests per store endpoint (Accepted vs answered) =="
          for u in 'orders?per_page=5' 'orders?status=pending_payment' 'notifications/unread-count' 'auth/refresh'; do
            echo "$u: $(grep -cF "$u" /tmp/api.log || true)"
          done
          echo "== connections accepted but never answered =="
          awk '/Accepted/{a[$7]=$0} /\]: [A-Z]+ /{delete a[$7]} END{for(k in a) print a[k]}' /tmp/api.log | head -40
          echo "== first 150 lines =="; head -n 150 /tmp/api.log || true
          echo "== last 100 lines =="; tail -n 100 /tmp/api.log || true

      - name: Upload Multi-Viewport Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wex-ui-screenshots
          path: wex-web/screenshots/
          retention-days: 14
          if-no-files-found: warn
